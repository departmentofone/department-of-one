<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit — Department of One</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0f1e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2334d399'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700&family=Public+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Admin-only additions - kept out of style.css since nothing else on the site needs them. */
    .admin-wrap { max-width: 640px; margin: 0 auto; padding: 48px 24px 80px; }
    .admin-wrap h1 { font-size: 1.6rem; margin-bottom: 6px; }
    .admin-wrap .sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 28px; }
    .field-label { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; display: block; }
    .field-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px; }
    .field-card textarea {
      width: 100%; min-height: 64px; resize: vertical; font-family: var(--font-body); font-size: 0.95rem;
      background: transparent; color: var(--text); border: none; outline: none; padding: 0; margin-bottom: 10px;
    }
    .field-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .save-state { font-size: 0.78rem; color: var(--muted); }
    .save-state.ok { color: var(--accent); }
    .save-state.err { color: #ef4444; }
    .login-card { max-width: 360px; margin: 96px auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow); }
    .login-card input {
      width: 100%; padding: 11px 13px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 0.95rem;
    }
    .login-card .error { color: #ef4444; font-size: 0.85rem; margin-top: 8px; }
    .signout { font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>

  <header>
    <div class="wrap">
      <a class="wordmark" href="/"><span class="dim">~/</span>department-of-one</a>
      <nav><span id="whoami" class="signout"></span></nav>
    </div>
  </header>

  <div id="loginView" class="login-card" style="display:none">
    <h1 style="font-size:1.3rem; margin-bottom: 4px;">Sign in</h1>
    <p class="sub" style="margin-bottom: 18px;">Same account you use for FitLog.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button class="btn btn-primary" style="width:100%; justify-content:center" id="signInBtn">Sign in</button>
    <p class="error" id="loginError"></p>
  </div>

  <main id="editorView" class="admin-wrap" style="display:none">
    <h1>Edit site text</h1>
    <p class="sub">Changes go live immediately - no redeploy needed. Reload the site to see them.</p>
    <div id="fields"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    var SUPABASE_URL = 'https://uxmdzudoojexfcoircoo.supabase.co'
    var SUPABASE_ANON_KEY = 'sb_publishable_JmN9P2H6oPKxcNh-jRPeEQ_aPc0NgLS'
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    var LABELS = {
      hero_eyebrow: 'Hero — small pill text',
      hero_title_pre: 'Hero heading — before "exactly"',
      hero_title_em: 'Hero heading — the italic word',
      hero_title_post: 'Hero heading — after "exactly"',
      hero_lede: 'Hero — subheading',
      principle_1_title: 'Principle 1 — title',
      principle_1_desc: 'Principle 1 — description',
      principle_2_title: 'Principle 2 — title',
      principle_2_desc: 'Principle 2 — description',
      principle_3_title: 'Principle 3 — title',
      principle_3_desc: 'Principle 3 — description',
      principle_4_title: 'Principle 4 — title',
      principle_4_desc: 'Principle 4 — description',
      fitlog_desc: 'FitLog card — description',
      more_soon_text: '"More soon" line',
      footer_tagline: 'Footer tagline',
    }
    // Falls back to the raw key for anything added later that isn't in LABELS yet, so a new
    // field is still editable here immediately - just without a friendly name until this map
    // is updated.
    function labelFor(key) {
      return LABELS[key] || key
    }

    var loginView = document.getElementById('loginView')
    var editorView = document.getElementById('editorView')
    var fieldsEl = document.getElementById('fields')
    var whoami = document.getElementById('whoami')

    function showLogin() {
      loginView.style.display = 'block'
      editorView.style.display = 'none'
    }

    async function showEditor(user) {
      loginView.style.display = 'none'
      editorView.style.display = 'block'
      whoami.innerHTML = user.email + ' · <a href="#" id="signOutLink">sign out</a>'
      document.getElementById('signOutLink').onclick = async function (e) {
        e.preventDefault()
        await sb.auth.signOut()
        location.reload()
      }

      var { data: rows, error } = await sb.from('site_content').select('key,value').order('key')
      if (error) {
        // RLS denies writes to anyone but the site owner, but read is public - if THIS still
        // errors, something else is wrong (network, expired session), so say so plainly.
        fieldsEl.innerHTML = '<p style="color:#ef4444">Couldn\'t load content: ' + error.message + '</p>'
        return
      }

      fieldsEl.innerHTML = ''
      rows.forEach(function (row) {
        var card = document.createElement('div')
        card.className = 'field-card'
        card.innerHTML =
          '<span class="field-label">' + labelFor(row.key) + '</span>' +
          '<textarea></textarea>' +
          '<div class="field-row"><button class="btn btn-primary" style="padding:8px 16px; font-size:0.85rem">Save</button>' +
          '<span class="save-state"></span></div>'
        var textarea = card.querySelector('textarea')
        var button = card.querySelector('button')
        var stateEl = card.querySelector('.save-state')
        textarea.value = row.value

        button.onclick = async function () {
          button.disabled = true
          stateEl.textContent = 'Saving…'
          stateEl.className = 'save-state'
          var { error } = await sb.from('site_content').update({ value: textarea.value, updated_at: new Date().toISOString() }).eq('key', row.key)
          button.disabled = false
          if (error) {
            stateEl.textContent = error.message.indexOf('policy') !== -1 || error.code === '42501'
              ? "Not allowed - this isn't the site owner's account."
              : 'Save failed: ' + error.message
            stateEl.className = 'save-state err'
          } else {
            stateEl.textContent = 'Saved ✓'
            stateEl.className = 'save-state ok'
            setTimeout(function () { stateEl.textContent = '' }, 2500)
          }
        }
        fieldsEl.appendChild(card)
      })
    }

    document.getElementById('signInBtn').onclick = async function () {
      var email = document.getElementById('email').value.trim()
      var password = document.getElementById('password').value
      var errorEl = document.getElementById('loginError')
      errorEl.textContent = ''
      var { data, error } = await sb.auth.signInWithPassword({ email: email, password: password })
      if (error) {
        errorEl.textContent = error.message
        return
      }
      showEditor(data.user)
    }

    sb.auth.getSession().then(function (res) {
      var session = res.data.session
      if (session) showEditor(session.user)
      else showLogin()
    })
  </script>
</body>
</html>
