<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Receipt - Turn your to-do list into a shop receipt</title>
  <meta name="description" content="Paste what you got done today and Receipt prints it as a little thermal-paper receipt, with a total, a barcode and a thank-you line. Save it as an image or print it for real." />
  <meta name="theme-color" content="#f6f3ec" />
  <link rel="canonical" href="https://www.departmentofone.net/receipt" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Department of One" />
  <meta property="og:title" content="Receipt - Turn your to-do list into a shop receipt" />
  <meta property="og:description" content="Paste what you got done today and Receipt prints it as a little thermal-paper receipt, with a total, a barcode and a thank-you line. Save it as an image or print it for real." />
  <meta property="og:url" content="https://www.departmentofone.net/receipt" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/kit/kit.css" />
  <link rel="stylesheet" href="/style.css" />
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="tool-bar">
    <div class="wrap">
      <a class="home" href="/#shelf" aria-label="Back to the shelf"><svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#ff5a36"/><path d="M15 9.2 19.6 7h1.9v18.2h3.3V28H11.8v-2.8h4.6V11.7l-3.1 1.5-1.1-2.5z" fill="#fff"/><g class="eyes" fill="#17171a"><circle cx="17.3" cy="15.4" r="1.25"/><circle cx="20.6" cy="15.4" r="1.25"/></g></svg><span>Shelf</span></a>
      <span class="sep" aria-hidden="true"></span>
      <span class="title"><span class="tile t-slate" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></svg></span><span>Receipt</span></span>
      <span class="spacer"></span>
      <a class="btn btn-coffee btn-sm" href="https://buymeacoffee.com/department.of.one" target="_blank" rel="noopener"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9zM16 10.5h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5c-.7.9-.7 1.6 0 2.5M12 3.5c-.7.9-.7 1.6 0 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span><span class="label-long">Buy me a </span>coffee</span></a>
    </div>
  </header>

  <main id="main" class="wrap tool">
    <style>
      .rc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
      .rc-paper { display: grid; place-items: center; padding: clamp(20px, 4vw, 40px); border-radius: var(--radius-lg); background: repeating-linear-gradient(45deg, #ece6d9 0 12px, #e6dfd0 12px 24px); }
      .rc-paper canvas { width: min(100%, 360px); height: auto; filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.18)); transform: rotate(-1.2deg); }
      .hint-line { font-family: var(--font-mono); font-size: 0.8rem; color: var(--faint); }
      @media (max-width: 860px) { .rc { grid-template-columns: 1fr; } }
      @media print { body > *:not(main), .tool-head, .rc > :first-child { display: none !important; } .rc { display: block; } .rc-paper { background: none; padding: 0; } .rc-paper canvas { transform: none; filter: none; width: 80mm; } }
    </style>

    <div class="tool-head">
      <h1>Receipt</h1>
      <p>Write down what you got done and get it back as a little shop receipt. Save it, share it, or print it on a real receipt printer.</p>
    </div>

    <div class="rc">
      <div class="panel-k stack">
        <label class="k-field"><span>Shop name</span><input class="k-input" id="shop" maxlength="40" value="The Shop of Getting Things Done" /></label>
        <label class="k-field"><span>Receipt for</span>
          <select class="k-select" id="period"><option value="today">Today</option><option value="week">This week</option><option value="month">This month</option><option value="year">This year</option></select>
        </label>
        <label class="k-field"><span>What you did, one per line</span>
          <textarea class="k-textarea" id="items" rows="9" spellcheck="true"></textarea>
          <span class="hint-line">Add a time with "|", like "Answered emails | 40m" or "Gym | 1h 15m".</span>
        </label>
        <label class="k-field"><span>Cashier</span><input class="k-input" id="cashier" maxlength="24" value="You" /></label>
        <div class="row">
          <button class="btn btn-primary" id="saveBtn" type="button">Save as image</button>
          <button class="btn btn-ghost" id="shareBtn" type="button" hidden>Share</button>
          <button class="btn btn-ghost" id="printBtn" type="button">Print</button>
        </div>
      </div>
      <div class="rc-paper"><canvas id="receipt" width="576" height="900" role="img" aria-label="Your receipt"></canvas></div>
    </div>
  </main>

  <footer class="k-footer">
    <div class="wrap">
      <span>Receipt is free and open source, made by <a href="/about">one person</a>.</span>
      <span><a href="/#shelf">More on the shelf</a> · <a href="https://github.com/departmentofone/department-of-one/tree/main/receipt" target="_blank" rel="noopener">Source code</a> · <a href="https://buymeacoffee.com/department.of.one" target="_blank" rel="noopener">Buy me a coffee</a> · <a href="/privacy">Privacy</a></span>
    </div>
  </footer>

  <script src="/kit/kit.js" defer></script>
  <script src="/receipt/app.js" defer></script>
</body>
</html>
