    <style>
      .ff-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
      .ff-progress { flex: 1; min-width: 160px; height: 8px; border-radius: 8px; background: var(--bg-deep); overflow: hidden; }
      .ff-progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 300ms var(--ease-out); }
      .ff-round { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); }
      .duel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: stretch; }
      .vs { align-self: center; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; color: var(--accent); transform: rotate(-8deg); }
      .fighter { display: grid; grid-template-rows: 1fr auto; gap: 14px; min-height: 280px; padding: clamp(20px, 3vw, 32px); border-radius: var(--radius-lg); background: var(--surface); border: 2px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer; text-align: left; transition: transform 200ms var(--ease-out), border-color 150ms ease, box-shadow 200ms ease, opacity 200ms ease; }
      .fighter:active { transform: scale(0.98); }
      @media (hover: hover) and (pointer: fine) { .fighter:hover { border-color: var(--text); box-shadow: var(--shadow); transform: translateY(-2px); } }
      .fighter .sample { font-size: clamp(1.5rem, 3.2vw, 2.4rem); line-height: 1.2; overflow-wrap: anywhere; color: var(--text); }
      .fighter .who { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--faint); }
      .fighter .who b { font-family: var(--font-mono); font-weight: 500; color: var(--muted); }
      .fighter.is-out { opacity: 0.3; transform: scale(0.97); }
      .champ { display: grid; justify-items: center; gap: 14px; padding: clamp(28px, 6vw, 56px) 20px; text-align: center; }
      .champ .crown { font-size: 3rem; line-height: 1; }
      .champ .sample { font-size: clamp(2rem, 6vw, 4rem); line-height: 1.1; max-width: 18ch; overflow-wrap: anywhere; }
      .champ pre { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--text); color: #f6f3ec; font-family: var(--font-mono); font-size: 0.78rem; text-align: left; max-width: 100%; overflow: auto; }
      .ladder { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
      .ladder span { padding: 4px 10px; border-radius: 999px; background: var(--bg-deep); font-size: 0.82rem; color: var(--muted); }
      @media (max-width: 760px) { .duel { grid-template-columns: 1fr; } .vs { justify-self: center; } }
    </style>

    <div class="tool-head">
      <h1>Font Fight</h1>
      <p>Two fonts, one sentence. Pick the one you like better until a single font is left standing. Every font here is free to use.</p>
    </div>

    <div class="panel-k stack" style="margin-bottom:16px">
      <div class="row">
        <label class="k-field" style="flex:1;min-width:220px"><span>Sample text</span><input class="k-input" id="sample" maxlength="120" value="The quick brown fox jumps over the lazy dog" /></label>
        <label class="k-field"><span>Fonts to include</span>
          <select class="k-select" id="pool"><option value="all">Everything</option><option value="sans">Sans serif</option><option value="serif">Serif</option><option value="display">Fun and display</option><option value="mono">Monospace</option></select>
        </label>
        <button class="btn btn-ghost" id="restart" type="button" style="align-self:end">New tournament</button>
      </div>
    </div>

    <div id="arena">
      <div class="ff-bar"><span class="ff-round" id="round"></span><div class="ff-progress"><i id="progress"></i></div><span class="ff-round" id="left"></span></div>
      <div class="duel" id="duel">
        <button class="fighter" type="button" id="a"><span class="sample"></span><span class="who"><b></b><span>Press 1 or ←</span></span></button>
        <span class="vs" aria-hidden="true">vs</span>
        <button class="fighter" type="button" id="b"><span class="sample"></span><span class="who"><b></b><span>Press 2 or →</span></span></button>
      </div>
    </div>
    <section class="panel-k champ" id="champ" hidden aria-live="polite"></section>
