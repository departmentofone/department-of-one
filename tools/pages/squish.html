    <style>
      .sq { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
      .sq-files { display: grid; gap: 10px; }
      .sq-item { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
      .sq-item img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; background: var(--bg-deep); }
      .sq-item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sq-item .meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
      .sq-item .saved { color: var(--live); font-weight: 600; }
      .sq-item .worse { color: var(--clay); }
      .sq-item .acts { display: flex; gap: 6px; }
      .bar { height: 4px; border-radius: 4px; background: var(--bg-deep); overflow: hidden; margin-top: 6px; }
      .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 200ms var(--ease-out); }
      .sq-total { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
      dialog.compare { width: min(980px, calc(100vw - 24px)); padding: 0; border: 0; border-radius: 20px; background: #111; overflow: hidden; }
      dialog.compare::backdrop { background: rgba(0, 0, 0, 0.6); }
      .cmp { position: relative; user-select: none; touch-action: none; cursor: ew-resize; }
      .cmp img { display: block; width: 100%; max-height: 78vh; object-fit: contain; }
      .cmp .after { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--x, 50%)); }
      .cmp .after img { width: 100%; height: 100%; }
      .cmp .line { position: absolute; top: 0; bottom: 0; left: var(--x, 50%); width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3); }
      .cmp .tag { position: absolute; top: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 0.8rem; font-weight: 600; }
      .cmp-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: #ddd; font-size: 0.88rem; }
      @media (max-width: 860px) { .sq { grid-template-columns: 1fr; } }
    </style>

    <div class="tool-head">
      <h1>Squish</h1>
      <p>Make photos smaller for the web, email or a slow upload. Everything happens in your browser, so your photos never leave your device.</p>
    </div>

    <div class="sq">
      <aside class="panel-k stack">
        <label class="k-field"><span>Format</span>
          <select class="k-select" id="format">
            <option value="image/webp">WebP (small, works everywhere)</option>
            <option value="image/avif">AVIF (smallest, newer)</option>
            <option value="image/jpeg">JPEG (oldest, safest)</option>
            <option value="image/png">PNG (lossless, big)</option>
          </select>
        </label>
        <label class="k-field"><span>Quality <b id="qv">80</b></span>
          <input class="k-range" id="quality" type="range" min="30" max="100" value="80" />
        </label>
        <label class="k-field"><span>Longest side</span>
          <select class="k-select" id="maxSide">
            <option value="0">Keep original size</option><option value="3840">3840 px (4K)</option><option value="2560">2560 px</option><option value="1920" selected>1920 px</option><option value="1280">1280 px</option><option value="800">800 px</option>
          </select>
        </label>
        <p class="small faint" id="support"></p>
      </aside>

      <div class="stack">
        <label class="drop" id="drop" for="file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l5 5M20 4l-5 5M4 20l5-5M20 20l-5-5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.2"/></svg>
          <strong>Drop photos here</strong>
          <span class="muted small">or click to choose. As many as you like.</span>
          <input id="file" type="file" accept="image/*" multiple hidden />
        </label>
        <div class="sq-total" id="total" hidden>
          <span id="totalText" class="muted"></span>
          <div class="row"><button class="btn btn-ghost btn-sm" id="redo" type="button">Re-squish with new settings</button><button class="btn btn-primary btn-sm" id="zipBtn" type="button">Download all (.zip)</button><button class="btn btn-ghost btn-sm" id="clear" type="button">Clear</button></div>
        </div>
        <div class="sq-files" id="files"></div>
      </div>
    </div>

    <dialog class="compare" id="cmpDialog" aria-label="Before and after">
      <div class="cmp" id="cmp"><img id="cmpBefore" alt="Original" /><div class="after"><img id="cmpAfter" alt="Squished" /></div><span class="line" aria-hidden="true"></span><span class="tag" style="left:10px">Original</span><span class="tag" style="right:10px">Squished</span></div>
      <div class="cmp-bar"><span>Drag to compare</span><button class="btn btn-ghost btn-sm" id="cmpClose" type="button">Close</button></div>
    </dialog>
