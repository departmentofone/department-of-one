    <style>
      .rc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
      .rc-paper { display: grid; place-items: center; padding: clamp(20px, 4vw, 40px); border-radius: var(--radius-lg); background: repeating-linear-gradient(45deg, #ece6d9 0 12px, #e6dfd0 12px 24px); }
      .rc-paper canvas { width: min(100%, 360px); height: auto; filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.18)); transform: rotate(-1.2deg); }
      .hint-line { font-family: var(--font-mono); font-size: 0.8rem; color: var(--faint); }
      @media (max-width: 860px) { .rc { grid-template-columns: 1fr; } }
      @media print { body > *:not(main), .tool-head, .rc > :first-child { display: none !important; } .rc { display: block; } .rc-paper { background: none; padding: 0; } .rc-paper canvas { transform: none; filter: none; width: 80mm; } }
    </style>

    <div class="tool-head">
      <h1>Receipt</h1>
      <p>Write down what you got done and get it back as a little shop receipt. Save it, share it, or print it on a real receipt printer.</p>
    </div>

    <div class="rc">
      <div class="panel-k stack">
        <label class="k-field"><span>Shop name</span><input class="k-input" id="shop" maxlength="40" value="The Shop of Getting Things Done" /></label>
        <label class="k-field"><span>Receipt for</span>
          <select class="k-select" id="period"><option value="today">Today</option><option value="week">This week</option><option value="month">This month</option><option value="year">This year</option></select>
        </label>
        <label class="k-field"><span>What you did, one per line</span>
          <textarea class="k-textarea" id="items" rows="9" spellcheck="true"></textarea>
          <span class="hint-line">Add a time with "|", like "Answered emails | 40m" or "Gym | 1h 15m".</span>
        </label>
        <label class="k-field"><span>Cashier</span><input class="k-input" id="cashier" maxlength="24" value="You" /></label>
        <div class="row">
          <button class="btn btn-primary" id="saveBtn" type="button">Save as image</button>
          <button class="btn btn-ghost" id="shareBtn" type="button" hidden>Share</button>
          <button class="btn btn-ghost" id="printBtn" type="button">Print</button>
        </div>
      </div>
      <div class="rc-paper"><canvas id="receipt" width="576" height="900" role="img" aria-label="Your receipt"></canvas></div>
    </div>
