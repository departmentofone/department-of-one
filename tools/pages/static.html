    <style>
      .st { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
      .sounds { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
      .sound { display: grid; gap: 12px; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: border-color 150ms ease, box-shadow 200ms ease; }
      .sound.is-on { border-color: rgba(23, 23, 26, 0.3); box-shadow: var(--shadow); }
      .sound .top { display: flex; align-items: center; gap: 12px; }
      .sound .tile { grid-row: auto; width: 44px; height: 44px; border-radius: 13px; }
      .sound .tile svg { width: 22px; height: 22px; }
      .sound b { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: -0.01em; }
      .sound .vol { font-family: var(--font-mono); font-size: 0.78rem; color: var(--faint); margin-left: auto; }
      .play-big { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow); transition: transform 160ms var(--ease-out), background-color 150ms ease; }
      .play-big:active { transform: scale(0.95); }
      .play-big svg { width: 36px; height: 36px; }
      .play-big .i-pause { display: none; }
      .play-big[aria-pressed='true'] .i-play { display: none; }
      .play-big[aria-pressed='true'] .i-pause { display: block; }
      .presets { display: flex; flex-wrap: wrap; gap: 6px; }
      @media (max-width: 860px) { .st { grid-template-columns: 1fr; } .st aside { order: -1; } }
    </style>

    <div class="tool-head">
      <h1>Static</h1>
      <p>Mix your own background noise. Every sound is generated live in your browser, so it never repeats awkwardly and works without a connection once the page has loaded.</p>
    </div>

    <div class="st">
      <div class="sounds" id="sounds"></div>
      <aside class="panel-k stack" style="justify-items:center;text-align:center">
        <button class="play-big" id="play" type="button" aria-pressed="false" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <p class="small muted" id="state">Press play, then raise the sounds you like.</p>
        <label class="k-field" style="width:100%;text-align:left"><span>Master volume</span><input class="k-range" id="master" type="range" min="0" max="100" value="70" /></label>
        <label class="k-field" style="width:100%;text-align:left"><span>Sleep timer</span>
          <select class="k-select" id="sleep"><option value="0">Off</option><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option><option value="90">90 minutes</option><option value="120">2 hours</option></select>
        </label>
        <div style="width:100%;text-align:left"><span class="k-label">Presets</span><div class="presets" id="presets" style="margin-top:8px"></div></div>
        <button class="btn btn-ghost btn-sm" id="shareBtn" type="button">Copy a link to this mix</button>
      </aside>
    </div>
